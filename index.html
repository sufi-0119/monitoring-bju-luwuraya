<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Dashboard Monitoring BJU Luwuraya">
  <meta name="google-site-verification" content="JskpRs307YRHCpLZhZU0VxeoQl0a-woyZ2X2btuuhB0">
  <title>Monitoring BJU Luwuraya</title>

  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">

  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --line: #e2e8f0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #eef2f7;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    .app iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #fff;
    }

    /* ===== Splash: konten nyata agar FCP/LCP terukur ===== */
    .splash {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 0%, #dbeafe 0%, #eef2f7 55%, #eef2f7 100%);
      transition: opacity .35s ease;
    }

    .splash--hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-card {
      width: 100%;
      max-width: 380px;
      padding: 28px 24px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .splash-card h1 {
      margin: 0 0 6px;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--ink);
    }

    .splash-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }

    .spinner {
      width: 26px;
      height: 26px;
      margin: 18px auto 0;
      border: 3px solid #dbeafe;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
      .splash { transition: none; }
    }

    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #f8fafc;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
    }

    .btn:hover { background: #eef2ff; border-color: #c7d2fe; }

    .noscript-frame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <main class="app">

    <section id="splash" class="splash" aria-label="Memuat dashboard">
      <div class="splash-card">
        <div class="logo" aria-hidden="true">BJU</div>
        <h1>Monitoring BJU Luwuraya</h1>
        <p id="splashStatus" role="status" aria-live="polite">
          Menyiapkan dashboard…
        </p>
        <div class="spinner" aria-hidden="true"></div>
        <a class="btn"
           href="https://script.google.com/macros/s/AKfycbxAcAN44OC_JYVhz_5O7q5WITSOX2tL3zChkSOsEuG-BrYfzUShnbhSaXksK4nP7zR1/exec"
           target="_blank" rel="noopener">
          Buka di tab baru
        </a>
      </div>
    </section>

    <iframe
      id="appFrame"
      title="Dashboard Monitoring BJU Luwuraya"
      data-src="https://script.google.com/macros/s/AKfycbxAcAN44OC_JYVhz_5O7q5WITSOX2tL3zChkSOsEuG-BrYfzUShnbhSaXksK4nP7zR1/exec"
      allow="clipboard-write"
      allowfullscreen></iframe>

  </main>

  <noscript>
    <iframe class="noscript-frame"
      src="https://script.google.com/macros/s/AKfycbxAcAN44OC_JYVhz_5O7q5WITSOX2tL3zChkSOsEuG-BrYfzUShnbhSaXksK4nP7zR1/exec"
      title="Dashboard Monitoring BJU Luwuraya"></iframe>
  </noscript>

  <script>
    (function () {
      var frame    = document.getElementById('appFrame');
      var splash   = document.getElementById('splash');
      var status   = document.getElementById('splashStatus');
      var src      = frame.getAttribute('data-src');
      var shownAt  = Date.now();
      var revealed = false;

      function reveal() {
        if (revealed) return;
        revealed = true;

        // Beri jeda singkat supaya splash tidak berkedip di koneksi cepat
        var wait = Math.max(0, 600 - (Date.now() - shownAt));

        setTimeout(function () {
          splash.classList.add('splash--hide');
          setTimeout(function () { splash.style.display = 'none'; }, 400);
        }, wait);
      }

      frame.addEventListener('load', reveal);

      // Muat iframe SETELAH paint pertama: judul splash langsung terlihat,
      // sehingga FCP/LCP terukur (menghindari NO_FCP di Lighthouse).
      requestAnimationFrame(function () {
        setTimeout(function () { frame.src = src; }, 0);
      });

      // Failsafe bila iframe lambat / diblokir jaringan
      setTimeout(function () {
        if (revealed) return;
        status.textContent =
          'Masih memuat… bila terlalu lama, buka dashboard di tab baru.';
      }, 8000);
    })();
  </script>
</body>
</html>
